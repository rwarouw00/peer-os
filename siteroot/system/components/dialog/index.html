<!DOCTYPE html>
<html>
<head>
<link href="css/custom.css" rel="stylesheet"/>
<link href="../../css/ui.css" rel="stylesheet"/>
<script src="../../js/app.js"></script>
</head>
<body>

<div id="message"></div>
<div class="buttonHolder">
<button class="default" id="OK">OK</button>
<button id="cancel">Cancel</button>
</div>

<script>

document.getElementById('message').innerHTML = localStorage.getItem('Skylight.dialog.message');
	
if (localStorage.getItem('Skylight.dialog.onOK') !== null) {
	document.getElementById('OK').onclick = function () {
		eval(localStorage.getItem('Skylight.dialog.onOK'));
		App.closeWindow(App.getAppID());
	}
}
	
	document.getElementById('cancel').onclick = function () {
		App.closeWindow(App.getAppID());
	}
	
	localStorage.setItem('Skylight.dialog.message', '');
	localStorage.setItem('SKylight.dialog.onOK', '');

</script>

</body>
</html>
