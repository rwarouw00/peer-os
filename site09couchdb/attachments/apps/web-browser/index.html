<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>Web Browser</title>
	<link href="../../system/css/ui.css" rel="stylesheet"/>
	<style>
		body { margin: 0; }
		.toolbar { height: 44px; padding: 6px 10px; box-sizing: border-box; }
		.toolbar img { vertical-align: middle; cursor: pointer; }
		#address { width: calc(100% - 100px); height: 28px; margin-left: 8px; font-size: 12pt; vertical-align: middle; }
		#page { position: absolute; top: 44px; left: 10px; width: calc(100% - 20px); height: calc(100% - 54px); border: none; background-color: #fff; }
	</style>
	<script src="../../system/js/core.js"></script>
	<script src="../../system/js/app.js"></script>
</head>
<body>
<div class="toolbar">
	<img id="back" src="back.png" alt="Back" title="Back"/>
	<img id="forward" src="forward.png" alt="Forward" title="Forward"/>
	<input type="text" id="address" placeholder="https://"/>
</div>
<iframe id="page"></iframe>
<script>
var address = document.getElementById('address');
var page = document.getElementById('page');

address.onkeyup = function (event) {
	if (event.keyCode === 13) {
		page.src = /^https?:\/\//.test(address.value) ? address.value : 'http://' + address.value;
	}
};

// Browsers only allow this for pages from the same site as Skylight OS.
function go(step) {
	try {
		page.contentWindow.history.go(step);
	} catch (error) {
		App.postNotification('Web Browser', 'Back and forward only work for pages on this site.');
	}
}

document.getElementById('back').onclick = function () { go(-1); };
document.getElementById('forward').onclick = function () { go(1); };
</script>
</body>
</html>
